<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Filtering Lab - Bare-Mux</title>
    <style>
        body { font-family: system-ui; max-width: 800px; margin: 40px auto; }
        .log-box { background: #111; color: #0f0; padding: 15px; font-family: monospace; }
        input, button { padding: 10px; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Proxy Lab: Bare-Mux + Epoxy</h1>
    
    <div id="status">Cargando transporte...</div>
    
    <input type="text" id="target-url" placeholder="https://example.com" value="https://example.com" />
    <button onclick="proxyRequest()">Probar Fetch via Túnel</button>

    <div class="log-box" id="log"></div>

    <!-- Necesitas empaquetar este script (ej. con Vite, Webpack o Rollup) -->
    <script type="module">
        import { BareMuxConnection } from '@mercuryworkshop/bare-mux';

        const log = (msg) => document.getElementById('log').innerHTML += msg + '<br>';
        
        async function initProxy() {
            try {
                log("[MAIN] Inicializando BareMuxConnection...");
                // Configura la conexión de multiplexación
                const connection = new BareMuxConnection('/bare-mux/worker.js');
                
                // Configura Epoxy como transporte hacia tu servidor backend (Aún por construir)
                // WSS Endpoint debe apuntar a tu servidor en PaaS (Render, VPS, etc.)
                await connection.setTransport('/epoxy/index.mjs', [{ wisp: 'wss://tu-backend-no-categorizado.com/wisp/' }]);
                log("[MAIN] Transporte Epoxy configurado.");

                log("[MAIN] Registrando sw.js...");
                const reg = await navigator.serviceWorker.register('/sw.js');
                await navigator.serviceWorker.ready;
                log("[MAIN] Service Worker listo y controlando.");
                
                document.getElementById('status').innerText = "Sistema Listo";
            } catch (err) {
                log(`[ERROR] ${err.message}`);
            }
        }

        window.proxyRequest = async () => {
            const url = document.getElementById('target-url').value;
            log(`[TEST] Solicitando vía SW: ${url}`);
            
            try {
                // El prefijo /__bare/ le dirá a nuestro SW que debe interceptar esto
                const res = await fetch(`/__bare/${url}`);
                const text = await res.text();
                log(`[TEST] Status: ${res.status}. Bytes recibidos: ${text.length}`);
            } catch(e) {
                log(`[ERROR Fetch] ${e.message}`);
            }
        };

        initProxy();
    </script>
</body>
</html>
